version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: stracker-postgres
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stracker}
      POSTGRES_USER: ${POSTGRES_USER:-stracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stracker_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - stracker-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stracker}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  stracker-network:
    driver: bridge
