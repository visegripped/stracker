<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 2000 700"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Stracker</title>
  <desc id="desc">Stracker stock tracker logo — ribbon S with candlesticks and rising arrow.</desc>

  <defs>
    <linearGradient id="lowerRibbonGrad" x1="0.05" y1="1" x2="0.75" y2="0">
      <stop offset="0%" stop-color="#0a2f96"/>
      <stop offset="35%" stop-color="#0a6af0"/>
      <stop offset="70%" stop-color="#12b4ff"/>
      <stop offset="100%" stop-color="#14c8c8"/>
    </linearGradient>

    <linearGradient id="upperRibbonGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0aa8c0"/>
      <stop offset="50%" stop-color="#10d4a4"/>
      <stop offset="100%" stop-color="#18ea78"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0.2" y1="1" x2="0.95" y2="0">
      <stop offset="0%" stop-color="#0aa878"/>
      <stop offset="45%" stop-color="#14dc68"/>
      <stop offset="100%" stop-color="#8aff6e"/>
    </linearGradient>

    <linearGradient id="candleGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#056e58"/>
      <stop offset="100%" stop-color="#24ff90"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#1c4e88"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>

    <filter id="foldShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="12" dy="16" stdDeviation="8" flood-color="#01060f" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- MARK -->
  <g transform="translate(40 60)">

    <!-- Candlesticks in the S counters, back to front -->
    <g fill="url(#candleGrad)">
      <!-- lower counter: 3 bars -->
      <rect x="108" y="392" width="44" height="88" rx="2"/>
      <rect x="176" y="358" width="44" height="122" rx="2"/>
      <rect x="244" y="368" width="44" height="112" rx="2"/>
      <!-- climbing with the arrow: 4 bars -->
      <rect x="312" y="278" width="44" height="148" rx="2"/>
      <rect x="380" y="236" width="44" height="186" rx="2"/>
      <rect x="448" y="198" width="44" height="168" rx="2"/>
      <rect x="516" y="158" width="44" height="150" rx="2"/>
    </g>
    <g stroke="#18f098" stroke-width="7" stroke-linecap="round">
      <line x1="130" y1="372" x2="130" y2="492"/>
      <line x1="198" y1="336" x2="198" y2="492"/>
      <line x1="266" y1="346" x2="266" y2="492"/>
      <line x1="334" y1="254" x2="334" y2="438"/>
      <line x1="402" y1="208" x2="402" y2="434"/>
      <line x1="470" y1="172" x2="470" y2="378"/>
      <line x1="538" y1="134" x2="538" y2="320"/>
    </g>

    <!-- Lower / back ribbon of the S (pointed bottom-left cut) -->
    <path
      fill="url(#lowerRibbonGrad)"
      d="
        M 18 528
        L 96 500
        L 168 500
        C 232 500 286 494 338 476
        C 392 456 418 426 418 388
        C 418 348 390 324 326 306
        L 198 272
        C 132 254 88 230 62 196
        C 32 158 30 112 54 76
        C 78 40 124 18 184 18
        L 328 18
        L 276 86
        L 184 86
        C 150 86 126 96 112 112
        C 98 128 98 148 114 164
        C 130 180 156 192 196 204
        L 270 224
        C 378 254 432 308 432 384
        C 432 450 402 502 344 534
        C 286 566 214 582 128 582
        L 48 582
        Z
      "
    />

    <!-- Fold contact shade -->
    <path
      fill="#020617"
      fill-opacity="0.42"
      d="
        M 62 196
        C 42 168 40 132 58 100
        C 72 76 100 54 140 42
        L 210 42
        C 170 72 140 110 128 150
        C 118 178 122 200 140 218
        L 188 236
        L 140 216
        C 108 204 80 202 62 196
        Z
      "
    />

    <!-- Upper ribbon in front -->
    <path
      fill="url(#upperRibbonGrad)"
      filter="url(#foldShadow)"
      d="
        M 54 76
        C 78 40 124 18 184 18
        L 340 18
        L 284 84
        L 184 84
        C 140 84 108 100 90 124
        C 70 150 70 180 90 206
        C 106 226 134 240 170 252
        L 148 292
        C 102 272 68 240 52 204
        C 30 160 30 112 54 76
        Z
      "
    />

    <!-- Rising arrow -->
    <path
      fill="url(#arrowGrad)"
      filter="url(#foldShadow)"
      d="
        M 168 258
        L 348 100
        L 300 74
        L 492 12
        L 448 186
        L 404 140
        L 214 304
        Z
      "
    />
  </g>

