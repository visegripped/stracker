<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 2000 700"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Stracker Logo</title>
  <desc id="desc">Stracker stock tracker logo with stylized S, candlesticks, and rising arrow.</desc>

  <defs>
    <linearGradient id="sGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3fa7"/>
      <stop offset="52%" stop-color="#119cff"/>
      <stop offset="100%" stop-color="#112d7a"/>
    </linearGradient>

    <linearGradient id="topGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15d8c0"/>
      <stop offset="100%" stop-color="#039f82"/>
    </linearGradient>

    <linearGradient id="greenGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#087e72"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17396d"/>
      <stop offset="100%" stop-color="#031a35"/>
    </linearGradient>
  </defs>

  <!-- MARK -->
  <g transform="translate(40 60)">

    <!-- Candlesticks -->
    <g fill="url(#greenGradient)">
      <rect x="95" y="390" width="46" height="95" rx="2"/>
      <rect x="165" y="355" width="46" height="130" rx="2"/>
      <rect x="235" y="365" width="46" height="120" rx="2"/>
      <rect x="305" y="275" width="46" height="150" rx="2"/>
      <rect x="375" y="235" width="46" height="190" rx="2"/>
    </g>

    <!-- Candlestick wicks -->
    <g stroke="#00e676" stroke-width="7">
      <line x1="118" y1="365" x2="118" y2="485"/>
      <line x1="188" y1="330" x2="188" y2="485"/>
      <line x1="258" y1="340" x2="258" y2="490"/>
      <line x1="328" y1="250" x2="328" y2="430"/>
      <line x1="398" y1="205" x2="398" y2="430"/>
    </g>

    <!-- Lower blue S ribbon -->
    <path
      d="
        M 38 505
        L 102 505
        C 164 505 220 504 276 490
        C 332 475 357 448 357 416
        C 357 379 331 357 269 341
        L 190 321
        C 126 305 83 283 57 252
        C 29 218 26 175 47 138
        C 69 100 112 78 169 78
        L 316 78
        L 266 144
        L 169 144
        C 139 144 117 152 105 165
        C 92 178 91 194 103 207
        C 115 220 137 230 171 239
        L 262 262
        C 366 288 418 336 418 406
        C 418 465 390 511 335 540
        C 280 569 211 584 127 584
        L 38 584
        Z
      "
      fill="url(#sGradient)"
    />

    <!-- Upper teal sweep -->
    <path
      d="
        M 57 250
        C 27 214 27 169 48 132
        C 70 94 112 72 170 72
        L 319 72
        L 266 137
        L 170 137
        C 129 137 99 149 81 171
        C 63 194 61 220 76 243
        Z
      "
      fill="url(#topGradient)"
    />

    <!-- Rising arrow -->
    <path
      d="
        M 171 258
        L 344 104
        L 298 78
        L 474 18
        L 434 184
        L 400 143
        L 217 300
        Z
      "
      fill="url(#greenGradient)"
    />
  </g>

  <!-- WORDMARK -->
  <text
    x="515"
    y="470"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="300"
    font-weight="800"
    letter-spacing="-12"
    fill="url(#textGradient)"
  >
    Stracker
  </text>
</svg>